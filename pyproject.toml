[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mandarinstudio"
version = "0.1.0"
description = "MVP de avaliador de tons de mandarim"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.5.5",
    "scipy>=1.18.0",
    "praat-parselmouth>=0.4.7",
    "fastdtw>=0.3.4",
    "matplotlib>=3.11.1",
    "vosk>=0.3.45",
    "gTTS>=2.5.4",
    "pypinyin>=0.55.0",
    "numpy>=2.5.2",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.2; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ipykernel>=7.3.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:pypinyin.*",
]

[tool.setuptools.packages.find]
include = ["mandarinstudio*"]